<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Wax Effect - Celebration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .fire-wax-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .center-point {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ffff00, #ffd700, #ff6b35);
            border-radius: 50%;
            box-shadow: 0 0 40px #ffff00, 0 0 80px #ffd700, 0 0 120px #ff6b35;
            animation: pulse-glow 0.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 40px #ffff00, 0 0 80px #ffd700, 0 0 120px #ff6b35;
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 60px #ffff00, 0 0 100px #ffd700, 0 0 150px #ff6b35;
                transform: scale(1.1);
            }
        }

        .celebration-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            margin-top: 150px;
        }

        h1 {
            color: #ffd700;
            font-size: 3em;
            text-shadow: 0 0 10px #ff6b35, 0 0 20px #ffd700;
            margin-bottom: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        p {
            color: #ffed4e;
            font-size: 1.2em;
            text-shadow: 0 0 5px #ff6b35;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
        }

        .sparkle-burst {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fire-wax-container">
            <div class="center-point"></div>
        </div>

        <div class="celebration-text">
            <h1>🎉 CELEBRATION 🎉</h1>
            <p>Something Amazing Just Happened!</p>
        </div>
    </div>

    <script>
        const colors = ['#ffff00', '#ffd700', '#ff6b35', '#ff4500', '#ffed4e', '#ffa500', '#ff1493', '#00ff00', '#00ffff'];
        
        function createSparkle(x, y, vx, vy, size, color, duration) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            sparkle.style.background = color;
            sparkle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
            document.body.appendChild(sparkle);

            let currentX = x;
            let currentY = y;
            let currentVX = vx;
            let currentVY = vy;
            const gravity = 0.1;
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                if (elapsed > duration) {
                    sparkle.remove();
                    return;
                }

                currentVY += gravity;
                currentX += currentVX;
                currentY += currentVY;

                // Fade out
                const opacity = 1 - (elapsed / duration);
                sparkle.style.opacity = opacity;
                sparkle.style.left = currentX + 'px';
                sparkle.style.top = currentY + 'px';

                requestAnimationFrame(animate);
            }
            animate();
        }

        function createBurst() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // Number of sparkles in burst
            const sparkleCount = 150;
            
            for (let i = 0; i < sparkleCount; i++) {
                const angle = (Math.PI * 2 * i) / sparkleCount;
                const speed = 8 + Math.random() * 15;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                
                const size = 2 + Math.random() * 6;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const duration = 800 + Math.random() * 600;
                
                // Small delay between sparkles for wave effect
                setTimeout(() => {
                    createSparkle(centerX, centerY, vx, vy, size, color, duration);
                }, Math.random() * 50);
            }
        }

        function createBallBurst() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // Create multiple balls that burst outward
            const ballCount = 8;
            
            for (let b = 0; b < ballCount; b++) {
                const ballAngle = (Math.PI * 2 * b) / ballCount;
                const ballSpeed = 10;
                const ballVX = Math.cos(ballAngle) * ballSpeed;
                const ballVY = Math.sin(ballAngle) * ballSpeed;
                
                // Each ball contains multiple sparkles
                const sparklesPerBall = 30;
                
                for (let i = 0; i < sparklesPerBall; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spreadSpeed = 5 + Math.random() * 8;
                    const vx = ballVX + Math.cos(angle) * spreadSpeed;
                    const vy = ballVY + Math.sin(angle) * spreadSpeed;
                    
                    const size = 2 + Math.random() * 5;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const duration = 900 + Math.random() * 700;
                    
                    setTimeout(() => {
                        createSparkle(centerX, centerY, vx, vy, size, color, duration);
                    }, b * 30 + Math.random() * 50);
                }
            }
        }

        // Create bursts continuously
        setInterval(() => {
            if (Math.random() > 0.5) {
                createBurst();
            } else {
                createBallBurst();
            }
        }, 600);

        // Initial burst
        createBurst();
        setTimeout(() => createBallBurst(), 300);
    </script>
</body>
</html>
