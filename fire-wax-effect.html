<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Wax Effect - Celebration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .fire-wax-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }

        .candle {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .candle-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 200px;
            background: linear-gradient(to right, #d4af37, #ffd700, #d4af37);
            border-radius: 10px 10px 0 0;
            box-shadow: inset -2px 0 5px rgba(0, 0, 0, 0.3), 
                        inset 2px 0 5px rgba(255, 255, 255, 0.3);
        }

        .wax-drips {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 150px;
        }

        .wax-drip {
            position: absolute;
            background: linear-gradient(to bottom, #e6b800, #d4af37);
            border-radius: 50% 50% 50% 0;
            animation: drip 3s ease-in infinite;
        }

        .wax-drip:nth-child(1) {
            width: 15px;
            height: 40px;
            left: 10px;
            animation-delay: 0s;
            transform: rotate(-20deg);
        }

        .wax-drip:nth-child(2) {
            width: 12px;
            height: 35px;
            left: 45px;
            animation-delay: 0.5s;
            transform: rotate(20deg);
        }

        .wax-drip:nth-child(3) {
            width: 14px;
            height: 38px;
            left: 75px;
            animation-delay: 1s;
            transform: rotate(-15deg);
        }

        @keyframes drip {
            0% {
                bottom: 0;
                opacity: 1;
            }
            100% {
                bottom: -100px;
                opacity: 0;
            }
        }

        .flame {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 80px;
        }

        .flame-inner {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #ff6b35, #f7931e, #ffd700, #ffed4e);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(8px);
            animation: flicker 0.3s ease-in-out infinite, 
                       flame-rise 2s ease-in-out infinite;
            box-shadow: 0 0 20px #ff6b35, 0 0 40px #f7931e, 0 0 60px #ffd700;
        }

        .flame-outer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 100px;
            background: linear-gradient(to top, rgba(255, 107, 53, 0.5), rgba(247, 147, 30, 0.3), transparent);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(15px);
            animation: flame-rise 2.5s ease-in-out infinite;
        }

        @keyframes flicker {
            0%, 100% {
                transform: translateX(-50%) scaleY(1);
            }
            50% {
                transform: translateX(-50%) scaleY(0.95);
            }
        }

        @keyframes flame-rise {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .particle {
            position: absolute;
            bottom: 280px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffed4e, #ffd700, transparent);
            border-radius: 50%;
            animation: rise 2s ease-out forwards;
            filter: blur(2px);
        }

        @keyframes rise {
            0% {
                transform: translate(-50%, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -300px) scale(0);
                opacity: 0;
            }
        }

        .celebration-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            color: #ffd700;
            font-size: 3em;
            text-shadow: 0 0 10px #ff6b35, 0 0 20px #f7931e;
            margin-bottom: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        p {
            color: #ffed4e;
            font-size: 1.2em;
            text-shadow: 0 0 5px #ff6b35;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fire-wax-container">
            <div class="candle">
                <div class="flame">
                    <div class="flame-outer"></div>
                    <div class="flame-inner"></div>
                </div>
                <div class="wax-drips">
                    <div class="wax-drip"></div>
                    <div class="wax-drip"></div>
                    <div class="wax-drip"></div>
                </div>
                <div class="particles" id="particles"></div>
                <div class="candle-body"></div>
            </div>
        </div>

        <div class="celebration-text">
            <h1>🎉 Celebration 🎉</h1>
            <p>Something Amazing Just Happened!</p>
        </div>
    </div>

    <script>
        // Generate particles continuously
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            setInterval(() => {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = (50 + (Math.random() - 0.5) * 40) + '%';
                particle.style.animationDuration = (1.5 + Math.random() * 0.5) + 's';
                particlesContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 2000);
            }, 200);
        }

        // Generate confetti
        function createConfetti() {
            setInterval(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.background = ['#ffd700', '#ff6b35', '#f7931e', '#ffed4e'][Math.floor(Math.random() * 4)];
                confetti.style.animationDuration = (2 + Math.random() * 1) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }, 100);
        }

        // Initialize animations
        createParticles();
        createConfetti();
    </script>
</body>
</html>
